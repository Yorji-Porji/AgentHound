[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agenthound"
version = "0.2.0"
description = "Graph-based attack path mapping for AI agents, MCP servers, and the NHIs they reach"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "Yorji-Porji" },
]
keywords = ["security", "offensive-security", "bloodhound", "mcp", "ai-agent", "nhi", "attack-path"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.7",
]

[project.scripts]
agenthound = "agenthound.cli:main"

[project.urls]
Homepage = "https://github.com/Yorji-Porji/agenthound"
Issues = "https://github.com/Yorji-Porji/agenthound/issues"

[tool.setuptools.packages.find]
include = ["agenthound*"]

[tool.setuptools.package-data]
"agenthound.data" = ["*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
