name: release

# Publishing a GitHub Release for a `v*` tag triggers this workflow. It builds
# the sdist + wheel, signs them with Sigstore *keyless* signing -- the signing
# identity is this repository's own GitHub Actions OIDC token, so there is no
# maintainer-held private key to manage or leak -- and attaches the artifacts
# and their `.sigstore.json` bundles to the release.
#
# A valid signature therefore proves an artifact was built by THIS repo's
# release workflow at the tagged commit. See docs/RELEASES.md for how to verify.

on:
  release:
    types: [published]

permissions:
  contents: write   # attach built + signed artifacts to the release
  id-token: write   # Sigstore keyless signing via GitHub OIDC

jobs:
  build-sign-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Fail if the package version does not match the tag
        run: |
          version="$(python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text("utf-8"))["project"]["version"])')"
          tag="${GITHUB_REF_NAME#v}"
          echo "pyproject version=$version  tag=$tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi

      - name: Sign artifacts with Sigstore (keyless)
        uses: sigstore/gh-action-sigstore-python@v3.3.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
          release-signing-artifacts: false

      - name: Attach artifacts and signatures to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
