# AgentHound Cypher query library.
#
# Each query is a YAML record with:
#   id: short snake_case identifier
#   title: human label
#   description: what the query answers
#   risk_category: how to think about results
#   cypher: the actual query
#
# Drop into BloodHound CE's Explore → Cypher tab.
#
# IMPORTANT — kind names are PascalCase here, matching what AgentHound *emits*,
# not the SCREAMING_SNAKE internal enum values. The exporter sanitizes kinds on
# emission, so the graph in BloodHound uses: Coerces, CallsTool, Exposes,
# AuthenticatesAs, GrantsAccess, CanReadCred, RunsAs, EscalatesVia — and the NHI
# node kind is emitted as `Nhi`. Querying with the internal names (:COERCES,
# :NHI, …) matches nothing.

queries:

  - id: production_blast_radius_from_injection
    title: Production blast radius from any injectable input
    description: >
      For every untrusted-content source that can coerce an agent, find every
      production resource reachable in up to four tool-call hops. The headline
      demo query.
    risk_category: critical
    cypher: |
      MATCH path = (i:InjectableInput)-[:Coerces]->(a:Agent)
             -[:CallsTool*1..4]->(t:MCPTool)
             -[:AuthenticatesAs]->(n:Nhi)
             -[:GrantsAccess]->(r:Resource)
      WHERE r.tier = 'production'
      RETURN path, length(path) AS hops
      ORDER BY hops ASC
      LIMIT 25

  - id: agents_with_excessive_tool_surface
    title: Agents with broadest reachable tool surface
    description: >
      Counts the number of distinct MCP tools each agent can call. Outliers
      are the agents with the largest blast radius — usually the ones with
      every MCP server enabled by default.
    risk_category: hygiene
    cypher: |
      MATCH (a:Agent)-[:CallsTool]->(t:MCPTool)
      RETURN a.name AS agent, count(DISTINCT t) AS tool_count
      ORDER BY tool_count DESC
      LIMIT 20

  - id: indirect_injection_to_cloud_mutator
    title: Indirect-injection paths to cloud-mutating tools
    description: >
      Indirect injection (poisoned README, malicious email, planted Jira
      comment) is the highest-impact vector because the user does not realize
      they are introducing attacker content. This query surfaces every chain
      that ends in a cloud-mutating sink.
    risk_category: critical
    cypher: |
      MATCH (i:InjectableInput)-[c:Coerces]->(a:Agent)
            -[:EscalatesVia]->(t:MCPTool)
      WHERE c.injection_class = 'indirect'
        AND any(tag IN t.classification WHERE tag = 'cloud_mutator')
      RETURN i.name AS source, a.name AS agent, t.name AS sink_tool

  - id: orphaned_nhis_with_production_access
    title: NHIs the runtime can read but no agent currently uses
    description: >
      Credentials sitting on the developer machine that are reachable but no
      currently-installed agent has been configured to use them. These are
      classic "ghost access" cases — high-value cleanup targets for the blue
      team.
    risk_category: hygiene
    cypher: |
      MATCH (rt:AgentRuntime)-[:CanReadCred]->(n:Nhi)
            -[:GrantsAccess]->(r:Resource {tier: 'production'})
      WHERE NOT EXISTS {
        MATCH (a:Agent)-[:RunsAs]->(rt)
        MATCH (a)-[:CallsTool]->(:MCPTool)-[:AuthenticatesAs]->(n)
      }
      RETURN rt.name, n.name, r.name

  - id: shadow_mcp_servers
    title: Unclassified MCP servers (potential shadow IT)
    description: >
      MCP servers that did not match the known-server registry. These are
      either novel third-party servers (likely benign) or unsanctioned ones
      configured by individual developers. Worth manual review either way.
    risk_category: hygiene
    cypher: |
      MATCH (s:MCPServer)-[:Exposes]->(t:MCPTool)
      WHERE any(c IN t.classification WHERE c = 'unclassified')
      RETURN s.name AS server, s.config_source AS config_path

  - id: aws_role_assumption_escalation
    title: AWS privilege escalation via role-assumption chains
    description: >
      Walks the CanAssume graph from local AWS profiles. Each hop is one
      assume-role wiring (role_arn + source_profile) in a developer's
      ~/.aws/config; chained together they reveal an identity that can reach far
      more powerful roles than it holds directly — often across accounts.
      Topology only: what each role can actually DO comes from the aws-iam
      collector's GrantsAccess edges.
    risk_category: critical
    cypher: |
      MATCH path = (start:Nhi)-[:CanAssume*1..5]->(role:Nhi)
      WHERE start.nhi_type = 'aws_profile'
      RETURN start.name  AS from_identity,
             role.name   AS reachable_role,
             length(path) AS hops
      ORDER BY hops DESC
      LIMIT 25

  - id: injection_to_full_access_identity
    title: Injection paths reaching an admin / full-access AWS identity
    description: >
      The aws-iam collector flags identities whose policies grant unrestricted
      access (grants_full_access). This finds untrusted-content sources that can
      coerce an agent into a tool backed by such an identity — independent of
      resource tier (aws-iam resources are tier-unknown until tagged, so this
      complements the production-tier blast-radius query).
    risk_category: critical
    cypher: |
      MATCH path = (i:InjectableInput)-[:Coerces]->(a:Agent)
             -[:CallsTool*1..4]->(t:MCPTool)-[:AuthenticatesAs]->(n:Nhi)
      WHERE n.grants_full_access = true
      RETURN path
      LIMIT 25
