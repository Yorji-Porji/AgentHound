# Known MCP server registry.
#
# Each entry maps a server name (as it appears in mcpServers config keys) to:
#   tools           — the tool functions the server exposes
#   classification  — injection-vector tags driving coercion inference
#   provider        — the upstream system this server authenticates to
#
# Classification taxonomy:
#   Sources (tools that pull untrusted content into agent context):
#     url_fetcher    — pulls remote content of unknown origin
#     rag_retriever  — returns indexed docs that may be poisoned
#     mail_reader    — classic indirect-prompt-injection vector
#     file_reader    — returns file content that may be untrusted
#
#   Sinks (tools an agent can be steered into invoking):
#     shell_executor — runs commands the agent decides on
#     code_writer    — writes code that will execute
#     cloud_mutator  — mutates cloud or SaaS state
#     query_runner   — reads-then-writes (both source and sink)
#
# Extending: add entries here or supply a second registry via --known-servers
# on the CLI. The CLI-supplied file overrides this default on key collision.

servers:

  # Anthropic reference servers (modelcontextprotocol/servers)
  filesystem:
    tools: [read_file, write_file, list_directory, search_files, move_file, create_directory]
    classification: [file_reader, code_writer]
    provider: local_fs

  git:
    tools: [git_status, git_diff, git_log, git_commit, git_create_branch, git_checkout, git_show]
    classification: [file_reader, code_writer]
    provider: local_git

  github:
    tools: [search_repos, get_file_contents, create_issue, create_pull_request, create_or_update_file, list_commits, get_issue, list_issues]
    classification: [rag_retriever, code_writer, cloud_mutator]
    provider: github

  gitlab:
    tools: [search_repositories, get_file_contents, create_or_update_file, create_merge_request, create_issue]
    classification: [rag_retriever, code_writer, cloud_mutator]
    provider: gitlab

  slack:
    tools: [search_messages, post_message, list_channels, get_channel_history, get_users, get_user_profile]
    classification: [mail_reader, cloud_mutator]
    provider: slack

  brave-search:
    tools: [brave_web_search, brave_local_search]
    classification: [url_fetcher, rag_retriever]
    provider: brave

  fetch:
    tools: [fetch]
    classification: [url_fetcher, rag_retriever]
    provider: web

  puppeteer:
    tools: [puppeteer_navigate, puppeteer_screenshot, puppeteer_click, puppeteer_fill, puppeteer_evaluate]
    classification: [url_fetcher, shell_executor]
    provider: web

  postgres:
    tools: [query, list_tables, describe_table]
    classification: [query_runner, cloud_mutator]
    provider: postgres

  sqlite:
    tools: [read_query, write_query, create_table, list_tables, describe_table]
    classification: [query_runner, code_writer]
    provider: sqlite

  memory:
    tools: [create_entities, create_relations, add_observations, delete_entities, search_nodes, read_graph]
    classification: [rag_retriever]
    provider: local_memory

  google-drive:
    tools: [search, read_file, gdrive_search, gdrive_read_file]
    classification: [rag_retriever, file_reader]
    provider: google

  google-maps:
    tools: [maps_geocode, maps_search_places, maps_place_details, maps_directions]
    classification: [url_fetcher, rag_retriever]
    provider: google

  sentry:
    tools: [get_sentry_issue, list_issues, list_project_events]
    classification: [rag_retriever, mail_reader]
    provider: sentry

  everart:
    tools: [generate_image]
    classification: [url_fetcher]
    provider: everart

  # Common community servers
  notion:
    tools: [search, query_database, retrieve_page, create_page, update_page, append_block_children]
    classification: [rag_retriever, code_writer, cloud_mutator]
    provider: notion

  linear:
    tools: [list_issues, create_issue, update_issue, list_projects, list_teams]
    classification: [rag_retriever, cloud_mutator]
    provider: linear

  jira:
    tools: [jql_search, get_issue, create_issue, update_issue, add_comment, transition_issue]
    classification: [rag_retriever, mail_reader, cloud_mutator]
    provider: atlassian

  confluence:
    tools: [search, get_page, create_page, update_page, get_space]
    classification: [rag_retriever, mail_reader, cloud_mutator]
    provider: atlassian

  salesforce:
    tools: [soql_query, sosl_search, get_record, create_record, update_record, describe_object]
    classification: [query_runner, cloud_mutator]
    provider: salesforce

  hubspot:
    tools: [search_contacts, get_contact, create_contact, update_contact, list_deals]
    classification: [rag_retriever, cloud_mutator]
    provider: hubspot

  asana:
    tools: [list_tasks, get_task, create_task, update_task, list_projects]
    classification: [rag_retriever, cloud_mutator]
    provider: asana

  airtable:
    tools: [list_records, get_record, create_record, update_record, search_records]
    classification: [query_runner, cloud_mutator]
    provider: airtable

  stripe:
    tools: [create_customer, list_customers, create_payment_intent, list_charges, retrieve_subscription]
    classification: [cloud_mutator, rag_retriever]
    provider: stripe

  aws:
    tools: [list_buckets, get_object, put_object, list_objects, describe_instances, run_instances]
    classification: [rag_retriever, cloud_mutator, file_reader]
    provider: aws

  azure:
    tools: [list_resources, get_resource, deploy_template, list_subscriptions]
    classification: [rag_retriever, cloud_mutator]
    provider: azure

  gcp:
    tools: [list_projects, list_instances, run_query, list_buckets]
    classification: [rag_retriever, cloud_mutator]
    provider: gcp

  kubernetes:
    tools: [list_pods, get_pod, exec_in_pod, list_namespaces, apply_manifest]
